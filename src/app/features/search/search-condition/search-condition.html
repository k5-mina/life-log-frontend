<section class="search-condtion">
  <form class="search-form" [formGroup]="searchCondition">
    <div class="search-conditions">
      <div class="search-row">
        <label for="date-from">発生日</label>

        <div class="date-range">
          <input
            class="date-input"
            id="date-from"
            type="date"
            formControlName="occurrenceDateFrom"
          />

          <span>～</span>

          <input class="date-input" id="date-to" type="date" formControlName="occurrenceDateTo" />
        </div>
      </div>

      <div class="search-row">
        <label for="time-from">発生時刻</label>

        <div class="time-range">
          <input
            class="time-input"
            id="time-from"
            type="time"
            formControlName="occurrenceTimeFrom"
          />

          <span>～</span>

          <input class="time-input" id="time-to" type="time" formControlName="occurrenceTimeTo" />
        </div>
      </div>

      <div class="form-row button-row">
        <legend>長さ</legend>

        <mat-chip-listbox multiple formControlName="durationCategories" aria-label="長さ">
          @for (option of durationOptions; track option) {
            <mat-chip-option [value]="option">
              {{ option }}
            </mat-chip-option>
          }
        </mat-chip-listbox>
      </div>

      <div class="form-row button-row">
        <legend>発生源</legend>

        <mat-chip-listbox multiple formControlName="occurrenceSources" aria-label="発生源">
          @for (option of sourceOptions; track option) {
            <mat-chip-option [value]="option">
              {{ option }}
            </mat-chip-option>
          }
        </mat-chip-listbox>
      </div>

      <div class="form-row button-row">
        <legend>騒音レベル</legend>

        <mat-chip-listbox multiple formControlName="noiseLevels" aria-label="騒音レベル">
          @for (option of noiseLevelOptions; track option) {
            <mat-chip-option [value]="option">
              {{ option }}
            </mat-chip-option>
          }
        </mat-chip-listbox>
      </div>

      <div class="form-row button-row">
        <legend>音の種類</legend>

        <mat-chip-listbox multiple formControlName="soundTypes" aria-label="音の種類">
          @for (option of soundTypeOptions; track option) {
            <mat-chip-option [value]="option">
              {{ option }}
            </mat-chip-option>
          }
        </mat-chip-listbox>
      </div>
    </div>

    <div class="search-actions">
      <button class="search-button">検索</button>
    </div>
  </form>
</section>
