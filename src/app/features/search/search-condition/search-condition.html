<section class="search-condtion">
  <form class="seach-form">
    <div class="search-condtions">
      <div class="search-row">
        <label for="date-from">発生日</label>

        <div class="date-range">
          <input
            class="date-input"
            id="date-from"
            type="date"
            name="date-from"
            [(ngModel)]="searchCondition.dateFrom"
          />

          <span>～</span>

          <input
            class="date-input"
            id="date-to"
            type="date"
            name="date-to"
            [(ngModel)]="searchCondition.dateTo"
          />
        </div>
      </div>

      <div class="form-row button-row">
        <legend>長さ</legend>

        <div class="button-row-options">
          <label class="choice">
            <input type="radio" name="duration-category" value="0～5分未満" />
            0～5分未満
          </label>

          <label class="choice">
            <input type="radio" name="duration-category" value="5～10分未満" />
            5～10分未満
          </label>

          <label class="choice">
            <input type="radio" name="duration-category" value="10～15分未満" />
            10～15分未満
          </label>

          <label class="choice">
            <input type="radio" name="duration-category" value="15～20分未満" />
            15～20分未満
          </label>

          <label class="choice">
            <input type="radio" name="duration-category" value="20～25分未満" />
            20～25分未満
          </label>

          <label class="choice">
            <input type="radio" name="duration-category" value="25～30分未満" />
            25～30分未満
          </label>

          <label class="choice">
            <input type="radio" name="duration-category" value="30分以上" />
            30分以上
          </label>

          <label class="choice">
            <input type="radio" name="duration-category" value="不明" />
            不明
          </label>
        </div>
      </div>

      <fieldset class="form-row button-row">
        <legend>発生源</legend>

        <div class="button-row-options">
          <label class="choice">
            <input type="radio" name="occurrence-source" value="上の部屋" />
            上の部屋
          </label>

          <label class="choice">
            <input type="radio" name="occurrence-source" value="隣の部屋" />
            隣の部屋
          </label>

          <label class="choice">
            <input type="radio" name="occurrence-source" value="同じ建物" />
            同じ建物
          </label>

          <label class="choice">
            <input type="radio" name="occurrence-source" value="近所" />
            近所
          </label>

          <label class="choice">
            <input type="radio" name="occurrence-source" value="その他" />
            その他
          </label>
        </div>
      </fieldset>

      <fieldset class="form-row button-row">
        <legend>騒音レベル</legend>

        <div class="button-row-options">
          <label class="choice">
            <input type="radio" name="noise-level" value="1" />
            1
          </label>

          <label class="choice">
            <input type="radio" name="noise-level" value="2" />
            2
          </label>

          <label class="choice">
            <input type="radio" name="noise-level" value="3" />
            3
          </label>

          <label class="choice">
            <input type="radio" name="noise-level" value="4" />
            4
          </label>

          <label class="choice">
            <input type="radio" name="noise-level" value="5" />
            5
          </label>
        </div>
      </fieldset>

      <fieldset class="form-row button-row">
        <legend>音の種類</legend>

        <div class="button-row-options">
          <label class="choice">
            <input type="radio" name="noise-types" value="足音" />
            足音
          </label>

          <label class="choice">
            <input type="radio" name="noise-types" value="衝撃音" />
            衝撃音
          </label>

          <label class="choice">
            <input type="radio" name="noise-types" value="物を引きずる音" />
            物を引きずる音
          </label>

          <label class="choice">
            <input type="radio" name="noise-types" value="話し声" />
            話し声
          </label>

          <label class="choice">
            <input type="radio" name="noise-types" value="その他" />
            その他
          </label>
        </div>
      </fieldset>
    </div>

    <div class="search-actions">
      <button class="search-button">検索</button>
    </div>
  </form>
</section>
