<section class="search-condtion">
  <form class="search-form" [formGroup]="searchCondition">
    <div class="search-conditions">
      <div class="search-row">
        <label for="date-from">発生日</label>

        <div class="date-range">
          <input
            class="date-input"
            id="date-from"
            type="date"
            formControlName="occurrenceDateFrom"
          />

          <span>～</span>

          <input class="date-input" id="date-to" type="date" formControlName="occurrenceDateTo" />
        </div>
      </div>

      <div class="form-row button-row">
        <legend>長さ</legend>

        <div class="button-row-options">
          @for (option of durationOptions; track option) {
            <label class="choice">
              <input
                type="checkbox"
                [value]="option"
                [checked]="searchCondition.controls.durationCategoryes.value.includes(option)"
                (change)="onDurationChange($event)"
              />
              {{ option }}
            </label>
          }
        </div>
      </div>

      <fieldset class="form-row button-row">
        <legend>発生源</legend>

        <div class="button-row-options">
          @for (option of sourceOptions; track option) {
            <label class="choice">
              <input
                type="checkbox"
                [value]="option"
                [checked]="searchCondition.controls.occurrenceSources.value.includes(option)"
                (change)="onSourceChange($event)"
              />
              {{ option }}
            </label>
          }
        </div>
      </fieldset>

      <fieldset class="form-row button-row">
        <legend>騒音レベル</legend>

        <div class="button-row-options">
          @for (option of noiseLevelOptions; track option) {
            <label class="choice">
              <input
                type="checkbox"
                [value]="option"
                [checked]="searchCondition.controls.noiseLevels.value.includes(option)"
                (change)="onNoiseLevelChange($event)"
              />
              {{ option }}
            </label>
          }
        </div>
      </fieldset>

      <fieldset class="form-row button-row">
        <legend>音の種類</legend>

        <div class="button-row-options">
          @for (option of soundTypeOptions; track option) {
            <label class="choice">
              <input
                type="checkbox"
                [value]="option"
                [checked]="searchCondition.controls.soundTypes.value.includes(option)"
                (change)="onSoundTypesChange($event)"
              />
              {{ option }}
            </label>
          }
        </div>
      </fieldset>
    </div>

    <div class="search-actions">
      <button class="search-button">検索</button>
    </div>
  </form>
</section>
