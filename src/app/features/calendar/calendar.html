<section class="calendar">
  <div class="calendar-header">
    <button
      type="button"
      class="month-button"
      aria-label="前月"
      matTooltip="前月へ"
      (click)="previousMonth()"
    >
      &lt;
    </button>

    <div class="year-month">
      <div class="year-label">{{ year }}</div>

      <div class="month-label">
        <div class="month-number">{{ month }}</div>
        <div class="month-eng">{{ monthEng }}</div>
      </div>
    </div>

    <button
      type="button"
      class="month-button"
      aria-label="翌月"
      matTooltip="翌月へ"
      (click)="nextMonth()"
    >
      &gt;
    </button>
  </div>

  <div class="calendar-grid">
    @for (weekday of ['Sun.', 'Mon.', 'Tue.', 'Wed.', 'Thu.', 'Fri.', 'Sat.']; track $index) {
      <div class="weekday">{{ weekday }}</div>
    }

    @for (day of days; track $index) {
      <div
        class="day"
        [class.today]="
          day !== null && year === todayYear && month === todayMonth && day === todayDate
        "
      >
        @if (day !== null) {
          <div class="day-header">
            <span>{{ day }}</span>

            <button
              type="button"
              class="add-button"
              [attr.aria-label]="day + '日の記録を追加'"
              [matTooltip]="day + '日の記録を追加'"
              (click)="openRegisterForm(day)"
            >
              +
            </button>
          </div>

          @if (day !== null && getRecordCount(day) > 0) {
            <button type="button" class="record-marker">{{ getRecordCount(day) }}件の記録</button>
          }
        }
      </div>
    }
  </div>
</section>
