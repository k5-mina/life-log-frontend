<section class="calendar">
  <div class="calendar-navigation" #calendarNavigation>
    <div class="calendar-header">
      <button
        type="button"
        class="month-button"
        aria-label="前月"
        matTooltip="前月へ"
        (click)="previousMonth()"
      >
        &lt;
      </button>

      <button
        type="button"
        class="year-month"
        matTooltip="年月を選択"
        aria-label="年月を選択"
        [attr.aria-label]="isYearMonthSelectorOpen()"
        (click)="toggleYearMonthSeletor()"
      >
        <div class="year-label">{{ year }}</div>

        <div class="month-label">
          <div class="month-number">{{ month }}</div>
          <div class="month-eng">{{ monthEng }}</div>
        </div>
      </button>

      <button
        type="button"
        class="month-button"
        aria-label="翌月"
        matTooltip="翌月へ"
        (click)="nextMonth()"
      >
        &gt;
      </button>
    </div>

    @if (isYearMonthSelectorOpen()) {
      <div class="year-month-selector">
        <div class="year-selector">
          <button type="butoon" (click)="changeSelectedYear(-1)">-</button>
          <span>{{ selectedYear }}年</span>
          <button type="button" (click)="changeSelectedYear(1)">+</button>
        </div>

        <div class="month-selector">
          @for (m of months; track m) {
            <button
              type="button"
              [class.selected]="selectedMonth === m"
              (click)="changeSelectedMonth(m)"
            >
              {{ m }}月
            </button>
          }
        </div>

        <div class="selector-actions">
          <button type="button" (click)="closeYearMonthSelector()">キャンセル</button>
          <button type="button" (click)="jumpToSelectedMonth()">移動する</button>
        </div>
      </div>
    }
  </div>

  <div class="calendar-grid">
    @for (weekday of ['日', '月', '火', '水', '木', '金', '土']; track $index) {
      <div class="weekday">{{ weekday }}</div>
    }

    @for (day of days; track $index) {
      <div
        class="day"
        [class.today]="
          day !== null && year === todayYear && month === todayMonth && day === todayDate
        "
      >
        @if (day !== null) {
          <div class="day-header">
            <span>{{ day }}</span>

            <button
              type="button"
              class="add-button"
              [attr.aria-label]="day + '日の記録を追加'"
              [matTooltip]="day + '日の記録を追加'"
              (click)="openCreateForm(day)"
            >
              +
            </button>
          </div>

          @if (day !== null && getRecordCount(day) > 0) {
            <button type="button" class="record-marker">{{ getRecordCount(day) }}件の記録</button>
          }
        }
      </div>
    }
  </div>
</section>
