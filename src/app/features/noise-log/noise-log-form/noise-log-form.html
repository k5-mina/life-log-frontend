<p>騒音記録画面です。</p>

<section class="app-noise-log-form">
    <h2>騒音記録</h2>

    <form [formGroup]="noiseLogForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
            <label for="occurrenceDate">発生日</label>
            <input id="occurrenceDate" type="date" formControlName="occurrenceDate">
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label for="startTime">開始時刻</label>
            <input id="startTime" type="time" formControlName="startTime">
            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label for="endTime">終了時刻</label>
            <input id="endTime" type="time" formControlName="endTime">
        </div>

        <div class="form-row">
            <span class="form-label">騒音レベル</span>

            <div class="stars">
                <button type="button" (click)="selectNoiseLevel(1)">
                    {{ noiseLogForm.controls.noiseLevel.value >= 1 ? '★' : '☆'}}
                </button>
                <button type="button" (click)="selectNoiseLevel(2)">
                    {{ noiseLogForm.controls.noiseLevel.value >= 2 ? '★' : '☆'}}
                </button>
                <button type="button" (click)="selectNoiseLevel(3)">
                    {{ noiseLogForm.controls.noiseLevel.value >= 3 ? '★' : '☆'}}
                </button>
                <button type="button" (click)="selectNoiseLevel(4)">
                    {{ noiseLogForm.controls.noiseLevel.value >= 4 ? '★' : '☆'}}
                </button>
                <button type="button" (click)="selectNoiseLevel(5)">
                    {{ noiseLogForm.controls.noiseLevel.value >= 5 ? '★' : '☆'}}
                </button>
            </div>

            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label for="noiseType">音の種類</label>

            <select id="noiseType" formControlName="noiseType">
                <option value="">選択してください</option>
                <option value="footstep">足音</option>
                <option value="impact">衝撃音</option>
                <option value="voice">話し声</option>
                <option value="other">その他</option>
            </select>

            <span class="required">*</span>
        </div>

        <div class="form-row">
            <label for="memo">備考</label>
            <textarea id="memo" class="memo" maxlength="200" formControlName="memo"></textarea>
        </div>

        <div class="form-row">
            <button type="submit">登録</button>
        </div>
    </form>
</section>
